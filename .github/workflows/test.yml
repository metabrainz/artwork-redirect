name: test

on:
  push:
  pull_request:

jobs:
  lint_and_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    needs: lint_and_unit
    steps:
      - uses: actions/checkout@v6

      - name: Run integration tests
        run: |
          docker compose -f docker/docker-compose.test.yml up --exit-code-from web_test

      - name: Copy artifacts
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml cp web_test:/data/test_report.xml .
          docker compose -f docker/docker-compose.test.yml cp web_test:/data/coverage.xml .

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test_report.xml
            coverage.xml
